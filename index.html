<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Checker</title>
<style>
  :root {
    --teal: #0d9488;
    --teal-light: #14b8a6;
    --blue: #2563eb;
    --deep: #0f172a;
    --muted: #64748b;
    --card-bg: #ffffff;
    --border: #e2f3f1;
    --pending: #94a3b8;
    --good: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #e9fbf7 0%, #f5fbfd 45%, #eaf5fc 100%);
    color: var(--deep);
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .header { text-align: center; margin-bottom: 22px; }
  .capsule {
    display: inline-block;
    padding: 8px 22px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(90deg, var(--teal-light), var(--blue));
    box-shadow: 0 6px 16px rgba(13,148,136,0.25);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 12px 30px rgba(15,23,42,0.06);
  }
  .lookup label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .lookup input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    font-size: 16px;
    outline: none;
    text-transform: uppercase;
  }
  .lookup input:focus { border-color: var(--teal-light); }
  .lookup button {
    width: 100%;
    margin-top: 14px;
    padding: 13px 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    cursor: pointer;
  }
  .lookup button:active { transform: translateY(1px); }
  .error-msg {
    margin-top: 12px;
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    display: none;
  }
  .student-view { display: none; margin-top: 18px; }
  .student-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .initials {
    font-size: 22px;
    font-weight: 800;
    color: var(--deep);
  }
  .section-badge {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--teal);
    background: #ecfdf9;
    border: 1px solid #ccf3ea;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 9px 4px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #f8fefc;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active {
    background: linear-gradient(90deg, var(--teal), var(--blue));
    color: #fff;
    border-color: transparent;
  }
  .tab-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--pending);
  }
  .tab-dot.done { background: var(--good); }
  .tab-btn.active .tab-dot { background: #fff; }

  .pending-box {
    text-align: center;
    padding: 34px 16px;
    color: var(--muted);
  }
  .pending-icon { font-size: 30px; margin-bottom: 8px; }
  .pending-title { font-weight: 700; color: var(--deep); margin-bottom: 4px; font-size: 15px; }
  .pending-sub { font-size: 13px; line-height: 1.4; }

  .cat-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 16px;
    margin-bottom: 12px;
    background: #fbfffe;
  }
  .cat-card.cat-major-exam { background: #f6f9ff; border-color: #dce6fb; }
  .cat-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cat-name {
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--deep);
    text-transform: uppercase;
  }
  .cat-weight {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--teal);
    background: #ecfdf9;
    padding: 1px 8px;
    border-radius: 999px;
  }
  .cat-card.cat-major-exam .cat-weight { color: var(--blue); background: #eaf1ff; }
  .cat-score {
    margin-left: auto;
    font-size: 15px;
    font-weight: 800;
    color: var(--deep);
  }
  .group { margin-top: 10px; }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin-bottom: 7px;
  }
  .group-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .group-weight {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
  }
  .group-score {
    margin-left: auto;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--deep);
  }
  .item-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
  }
  .item-tile {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 9px;
  }
  .cat-card.cat-major-exam .item-tile { border-color: #dce6fb; }
  .item-label {
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .item-frac {
    font-size: 14px;
    font-weight: 800;
    color: var(--deep);
  }
  .grade-highlight {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    padding: 14px 16px;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    color: #fff;
    font-weight: 800;
  }
  .grade-highlight span:first-child { font-size: 13px; letter-spacing: 0.4px; text-transform: uppercase; }
  .grade-highlight span:last-child { font-size: 19px; }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    background: #fbfffe;
  }
  .status-left { display: flex; align-items: center; gap: 9px; }
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pending);
    flex-shrink: 0;
  }
  .status-dot.done { background: var(--good); }
  .status-label { font-weight: 700; font-size: 14px; color: var(--deep); }
  .status-value { font-weight: 700; font-size: 14px; }
  .status-value.done { color: var(--teal); }
  .status-value.pending { color: var(--pending); font-weight: 600; font-style: italic; }

  .final-box {
    margin-top: 14px;
    text-align: center;
    padding: 22px 16px;
    border-radius: 14px;
    border: 1.5px dashed #cbd5e1;
    color: var(--muted);
  }
  .final-box.ready {
    border: none;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    color: #fff;
  }
  .final-box .final-label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
  .final-box .final-value { font-size: 26px; font-weight: 800; }
  .final-box .final-sub { font-size: 12.5px; margin-top: 6px; line-height: 1.4; }

  .footer {
    text-align: center;
    margin-top: 26px;
    font-size: 13px;
    color: var(--deep);
    opacity: 0.85;
    line-height: 1.5;
    padding: 0 10px;
  }
</style>
</head>

  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === '\r') { /* skip */ }
        else { field += c; }
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    var headers = rows[0];
    var out = [];
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].length === 1 && rows[r][0] === "") continue;
      var obj = {};
      for (var c2 = 0; c2 < headers.length; c2++) {
        obj[headers[c2]] = rows[r][c2] !== undefined ? rows[r][c2] : "";
      }
      out.push(obj);
    }
    return out;
  }

  function loadGrades() {
    try {
      rosterData = parseCSV(EMBEDDED_CSV);
      detailData = EMBEDDED_DETAIL;
    } catch (err) {
      loadError = err;
    }
    return Promise.resolve();
  }

  function initialsOf(match) {
    function firstLetter(s) { s = (s || "").trim(); return s ? s.charAt(0).toUpperCase() + "." : ""; }
    return firstLetter(match[FIRSTNAME_COLUMN]) + firstLetter(match[MIDDLENAME_COLUMN]) + firstLetter(match[LASTNAME_COLUMN]);
  }

  function formatPct(v) {
    if (v === undefined || v === null || v === "") return "—";
    var n = parseFloat(v);
    if (isNaN(n)) return "—";
    return (Math.round(n * 100) / 100) + "%";
  }

  function slug(name) {
    return String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function itemTileHTML(it) {
    return '<div class="item-tile">' +
      '<div class="item-label">' + escapeHTML(it.label) + '</div>' +
      '<div class="item-frac">' + it.raw + '/' + it.max + '</div>' +
      '</div>';
  }

  function categoryHTML(cat) {
    var html = '<div class="cat-card cat-' + slug(cat.name) + '">';
    html += '<div class="cat-head">' +
      '<span class="cat-name">' + escapeHTML(cat.name) + '</span>' +
      '<span class="cat-weight">' + cat.weight + '%</span>' +
      '<span class="cat-score">' + formatPct(cat.score) + '</span>' +
      '</div>';
    if (cat.groups) {
      cat.groups.forEach(function (g) {
        html += '<div class="group">';
        html += '<div class="group-head">' +
          '<span class="group-name">' + escapeHTML(g.name) + '</span>' +
          '<span class="group-weight">' + g.weight + '%</span>' +
          '<span class="group-score">' + formatPct(g.score) + '</span>' +
          '</div>';
        html += '<div class="item-grid">' + g.items.map(itemTileHTML).join('') + '</div>';
        html += '</div>';
      });
    } else if (cat.items) {
      html += '<div class="item-grid">' + cat.items.map(itemTileHTML).join('') + '</div>';
    }
    html += '</div>';
    return html;
  }

  function escapeHTML(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function periodDetail(code, period) {
    var d = detailData[code];
    return d && d[period] ? d[period] : null;
  }

  function pendingHTML(period) {
    return '<div class="pending-box">' +
      '<div class="pending-icon">⏳</div>' +
      '<div class="pending-title">' + escapeHTML(period) + ' is pending</div>' +
      '<div class="pending-sub">Your ' + escapeHTML(period).toLowerCase() + ' scores haven\'t been posted yet.<br>Check back once they\'re released.</div>' +
      '</div>';
  }

  function renderPeriodTab(code, period) {
    var detail = periodDetail(code, period);
    if (!detail) return pendingHTML(period);
    var html = detail.categories.map(categoryHTML).join('');
    html += '<div class="grade-highlight"><span>' + escapeHTML(period) + ' Grade</span><span>' + formatPct(detail.grade) + '</span></div>';
    return html;
  }

  function renderFinalRatingTab(match) {
    var code = match[CODE_COLUMN];
    var html = "";
    PERIODS.forEach(function (period) {
      var detail = periodDetail(code, period);
      if (detail) {
        html += '<div class="status-row"><div class="status-left"><span class="status-dot done"></span><span class="status-label">' + escapeHTML(period) + '</span></div><span class="status-value done">' + formatPct(detail.grade) + '</span></div>';
      } else {
        html += '<div class="status-row"><div class="status-left"><span class="status-dot"></span><span class="status-label">' + escapeHTML(period) + '</span></div><span class="status-value pending">Pending</span></div>';
      }
    });
    var finalRating = (match[FINAL_RATING_COLUMN] || "").trim();
    var allDone = PERIODS.every(function (p) { return !!periodDetail(code, p); });
    if (finalRating !== "") {
      html += '<div class="final-box ready"><div class="final-label">Final Rating</div><div class="final-value">' + escapeHTML(finalRating) + '</div></div>';
    } else {
      var missing = PERIODS.filter(function (p) { return !periodDetail(code, p); });
      html += '<div class="final-box"><div class="final-label">Final Rating</div><div class="final-value" style="font-size:16px;">Pending</div>' +
        '<div class="final-sub">Waiting on ' + missing.map(escapeHTML).join(' and ') + '. Your Final Rating is posted once every period is complete.</div></div>';
    }
    return html;
  }

  function renderTabContent() {
    var container = document.getElementById("tabContent");
    if (activeTab === "FinalRating") {
      container.innerHTML = renderFinalRatingTab(currentMatch);
    } else {
      container.innerHTML = renderPeriodTab(currentMatch[CODE_COLUMN], activeTab);
    }
  }

  function tabDotDone(code, tabKey) {
    if (tabKey === "FinalRating") {
      return !!(currentMatch[FINAL_RATING_COLUMN] || "").trim();
    }
    return !!periodDetail(code, tabKey);
  }

  function renderStudent() {
    document.getElementById("initials").textContent = initialsOf(currentMatch);
    document.getElementById("sectionBadge").textContent = "Section " + currentMatch[SECTION_COLUMN];

    var tabDefs = PERIODS.map(function (p) { return { key: p, label: p }; });
    tabDefs.push({ key: "FinalRating", label: "Final Rating" });

    var tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = "";
    tabDefs.forEach(function (t) {
      var btn = document.createElement("button");
      btn.className = "tab-btn" + (activeTab === t.key ? " active" : "");
      var dot = document.createElement("span");
      dot.className = "tab-dot" + (tabDotDone(currentMatch[CODE_COLUMN], t.key) ? " done" : "");
      var label = document.createElement("span");
      label.textContent = t.label;
      btn.appendChild(dot);
      btn.appendChild(label);
      btn.addEventListener("click", function () {
        activeTab = t.key;
        renderStudent();
      });
      tabsEl.appendChild(btn);
    });

    renderTabContent();
    document.getElementById("studentView").style.display = "block";
  }

  function showError(msg) {
    var err = document.getElementById("errorMsg");
    err.textContent = msg;
    err.style.display = "block";
    document.getElementById("studentView").style.display = "none";
  }

  function hideError() {
    document.getElementById("errorMsg").style.display = "none";
  }

  function handleLookup() {
    var raw = document.getElementById("codeInput").value.trim();
    if (!raw) { showError("Please enter your private code."); return; }
    if (loadError) { showError("Grades could not be loaded right now. Please try again later."); return; }
    var normalized = raw.toUpperCase();
    var match = null;
    for (var i = 0; i < rosterData.length; i++) {
      if ((rosterData[i][CODE_COLUMN] || "").trim().toUpperCase() === normalized) { match = rosterData[i]; break; }
    }
    if (!match) { showError("No record found for that code. Please check and try again."); return; }
    hideError();
    currentMatch = match;
    activeTab = "Prelim";
    renderStudent();
  }

  document.getElementById("lookupBtn").addEventListener("click", handleLookup);
  document.getElementById("codeInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") handleLookup();
  });

  loadGrades();
</script>
</body>
</html>
